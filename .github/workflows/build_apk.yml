name: Build Android APK (Vite + Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @tailwindcss/oxide-linux-x64-gnu @tailwindcss/vite

      - name: Build Web Assets (Vite)
        run: |
          npm run build

      - name: Setup Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "YolAcik" "com.yolacik.app" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YolAcik-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
